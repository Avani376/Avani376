<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMergeNode in="b"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="0.82" stop-color="#00f0ff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#00f0ff" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1526"/>
    <stop offset="1" stop-color="#05070f"/>
  </linearGradient>
</defs>
<style>
  .st{animation:twk 4s ease-in-out infinite alternate}
  @keyframes twk{from{opacity:.1}to{opacity:.9}}
  .end{animation:subp 3.4s ease-in-out infinite}
  @keyframes subp{0%,100%{opacity:.55}50%{opacity:1}}
  .dot{animation:blk 1.2s steps(2,start) infinite}
  @keyframes blk{to{visibility:hidden}}
  .swp{animation:swp 6s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes swp{0%{transform:translateY(0);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateY(124px);opacity:0}}
  .wave{animation:wv linear infinite}
  @keyframes wv{from{transform:translateX(0)}to{transform:translateX(-1375px)}}
  .rise{animation:ris 8s linear infinite;opacity:0}
  @keyframes ris{0%{transform:translateY(0);opacity:0}12%{opacity:.9}85%{opacity:.5}100%{transform:translateY(-170px);opacity:0}}
</style>
