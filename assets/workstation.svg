<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="470" viewBox="0 0 900 470" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMergeNode in="b"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="0.82" stop-color="#00f0ff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#00f0ff" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1526"/>
    <stop offset="1" stop-color="#05070f"/>
  </linearGradient>
</defs>
<defs>
  <radialGradient id="roomG" cx="0.5" cy="0.42" r="1">
    <stop offset="0" stop-color="#101a30"/><stop offset="1" stop-color="#05070f"/>
  </radialGradient>
  <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0.34"/>
    <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonG" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e8f4ff"/><stop offset="0.35" stop-color="#bcd9ff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#bcd9ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b2437"/><stop offset="1" stop-color="#071626"/>
  </linearGradient>
  <pattern id="blinds" width="10" height="14" patternUnits="userSpaceOnUse">
    <rect width="10" height="9" fill="#0d1830"/>
    <rect y="9" width="10" height="5" fill="#1a2c50"/>
  </pattern>
</defs>
<style>
  .ws{animation:twk 3s ease-in-out infinite alternate}
  @keyframes twk{from{opacity:.2}to{opacity:1}}
  .scr{animation:scr 4.2s ease-in-out infinite}
  @keyframes scr{0%,100%{opacity:.55}50%{opacity:1}}
  .key{animation:kp 3.3s steps(1) infinite}
  @keyframes kp{0%{opacity:.9}6%{opacity:0}100%{opacity:0}}
  .rgb{animation:rgb 9s linear infinite}
  @keyframes rgb{0%{fill:#00f0ff}25%{fill:#a78bfa}50%{fill:#f472b6}75%{fill:#4ade80}100%{fill:#00f0ff}}
  .steam{animation:stm 3.4s ease-in-out infinite}
  @keyframes stm{0%{transform:translateY(0);opacity:0}25%{opacity:.55}100%{transform:translateY(-26px);opacity:0}}
  .clock{animation:blk 1s steps(2,start) infinite}
  @keyframes blk{to{visibility:hidden}}
  .glowp{animation:gp 5s ease-in-out infinite}
  @keyframes gp{0%,100%{opacity:.5}50%{opacity:.95}}
  .bd{stroke-dasharray:5 7;animation:dsh 22s linear infinite}
  @keyframes dsh{to{stroke-dashoffset:-600}}
  .cur2{animation:blk 1.05s steps(2,start) infinite}
  @keyframes blk{to{visibility:hidden}}
</style>

<rect width="900" height="470" rx="14" fill="url(#roomG)"/>

<!-- wall clock -->
<circle cx="742" cy="92" r="30" fill="#0c1526" stroke="#1c2a44" stroke-width="2"/>
<line x1="742" y1="92" x2="742" y2="74" stroke="#7c8db0" stroke-width="2.4"/>
<line x1="742" y1="92" x2="756" y2="99" stroke="#7c8db0" stroke-width="2"/>
<circle cx="742" cy="92" r="2.4" fill="#00f0ff"/>
<text x="742" y="140" text-anchor="middle" font-size="11" fill="#7c8db0" letter-spacing="1">02<tspan class="clock">:</tspan>47 AM</text>

<!-- window with blinds + moon -->
<g>
  <rect x="528" y="52" width="168" height="128" rx="6" fill="url(#blinds)" stroke="#1c2a44" stroke-width="2"/>
  <circle cx="560" cy="78" r="1.4" fill="#cfe8ff" class="ws" style="animation-delay:-0.0s"/><circle cx="600" cy="96" r="1.0" fill="#cfe8ff" class="ws" style="animation-delay:-1.2s"/><circle cx="640" cy="70" r="1.6" fill="#cfe8ff" class="ws" style="animation-delay:-0.5s"/><circle cx="690" cy="88" r="1.1" fill="#cfe8ff" class="ws" style="animation-delay:-2.1s"/><circle cx="670" cy="110" r="1.2" fill="#cfe8ff" class="ws" style="animation-delay:-1.6s"/>
  <circle cx="662" cy="86" r="26" fill="url(#moonG)"/>
  <circle cx="662" cy="86" r="12" fill="#e8f4ff" opacity="0.9"/>
</g>

<!-- ambient screen glow -->
<ellipse class="scr" cx="550" cy="230" rx="330" ry="190" fill="url(#screenGlow)"/>

