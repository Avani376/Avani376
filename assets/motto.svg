<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="820" height="84" viewBox="0 0 820 84" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMergeNode in="b"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="0.82" stop-color="#00f0ff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#00f0ff" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1526"/>
    <stop offset="1" stop-color="#05070f"/>
  </linearGradient>
</defs>
<style>
  .cur{animation:blk 1.05s steps(2,start) infinite}
  @keyframes blk{to{visibility:hidden}}
</style>
<defs><clipPath id="ml0"><rect x="94" y="0" width="0" height="84"><animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.04;0.14;0.23;0.26" dur="16.0s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="ml1"><rect x="94" y="0" width="0" height="84"><animate attributeName="width" values="0;0;289;289;0" keyTimes="0;0.26;0.36;0.45;0.47" dur="16.0s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="ml2"><rect x="94" y="0" width="0" height="84"><animate attributeName="width" values="0;0;253;253;0" keyTimes="0;0.48;0.58;0.67;0.70" dur="16.0s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="ml3"><rect x="94" y="0" width="0" height="84"><animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.70;0.80;0.89;0.92" dur="16.0s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath></defs>
<rect width="820" height="84" rx="12" fill="#0a101f" stroke="#b8860b" stroke-opacity="0.55"/>
<rect x="1.5" y="1.5" width="817" height="81" rx="10.5" fill="#0b1220"/>
<circle cx="26" cy="42" r="5" fill="#ffd166" filter="url(#glow)" class="glowf"/>
<text x="40" y="32" font-size="11" letter-spacing="2" fill="#7c8db0">MOTTO.SEQ — LIVE FEED</text>
<text x="34" y="50" font-size="15" fill="#7c8db0">$ echo</text>
<text x="96" y="50" font-size="15" fill="#4ade80" clip-path="url(#ml0)" class="glowf">"teaching machines to read PDFs"</text><text x="96" y="50" font-size="15" fill="#00f0ff" clip-path="url(#ml1)" class="glowf">"shipping jallekha to production"</text><text x="96" y="50" font-size="15" fill="#a78bfa" clip-path="url(#ml2)" class="glowf">"turning coffee into commits"</text><text x="96" y="50" font-size="15" fill="#ffd166" clip-path="url(#ml3)" class="glowf">"open to collaborate ▸ DMs open"</text>
<rect class="cur" x="110" y="38" width="9" height="15" fill="#ffd166"/>
