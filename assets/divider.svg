<line x1="950" y1="13" x2="1050" y2="13" stroke="#a78bfa" stroke-width="2" filter="url(#glow)" class="p2"/>
<circle cx="550.0" cy="13" r="3" fill="#00f0ff" filter="url(#glow)"/>
