<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="26" viewBox="0 0 1100 26" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" >
<style>
  .p1{animation:p1 3.2s linear infinite}
