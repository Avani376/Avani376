<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="54" viewBox="0 0 1100 54" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMergeNode in="b"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="0.82" stop-color="#00f0ff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#00f0ff" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1526"/>
    <stop offset="1" stop-color="#05070f"/>
  </linearGradient>
</defs>
<style>
  .run{animation:run 26s linear infinite}
  @keyframes run{from{transform:translateX(0)}to{transform:translateX(-1423px)}}
  .tick-dot{animation:blk 1s steps(2,start) infinite}
  @keyframes blk{to{visibility:hidden}}
</style>
<defs>
  <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#05070f" stop-opacity="1"/><stop offset="1" stop-color="#05070f" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#05070f" stop-opacity="1"/><stop offset="1" stop-color="#05070f" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1100" height="54" rx="10" fill="#0a101f" stroke="#1c2a44"/>
<g class="run">
  <text x="20" y="34" font-size="17" letter-spacing="3" fill="#00f0ff" opacity="0.9" textLength="1383" lengthAdjust="spacingAndGlyphs">TYPESCRIPT ▪ PYTHON ▪ JAVASCRIPT ▪ HTML/CSS ▪ RAG PIPELINES ▪ LLM APPS ▪ STREAMLIT ▪ GIT ▪ OPEN SOURCE ▪ </text>
  <text x="1443" y="34" font-size="17" letter-spacing="3" fill="#00f0ff" opacity="0.9" textLength="1383" lengthAdjust="spacingAndGlyphs">TYPESCRIPT ▪ PYTHON ▪ JAVASCRIPT ▪ HTML/CSS ▪ RAG PIPELINES ▪ LLM APPS ▪ STREAMLIT ▪ GIT ▪ OPEN SOURCE ▪ </text>
</g>
<rect width="130" height="54" fill="url(#fadeL)"/>
<rect x="970" width="130" height="54" fill="url(#fadeR)"/>
<text class="tick-dot" x="14" y="31.0" font-size="12" fill="#4ade80">●</text>
