  .pc{animation:pk 2.8s ease-in-out infinite}
  @keyframes pk{0%,100%{opacity:.6}50%{opacity:1}}
  .blip{animation:blp 2.4s ease-in-out infinite}
  @keyframes blp{0%,100%{opacity:.25}50%{opacity:1}}
  .bd{stroke-dasharray:5 7;animation:dsh 22s linear infinite}
  @keyframes dsh{to{stroke-dashoffset:-600}}
</style>

