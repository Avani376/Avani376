<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="66" viewBox="0 0 300 66" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMergeNode in="b"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="0.82" stop-color="#00f0ff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#00f0ff" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1526"/>
    <stop offset="1" stop-color="#05070f"/>
  </linearGradient>
</defs>
<style>
  .ring{animation:ring 2.6s ease-out infinite}
  @keyframes ring{0%{opacity:.8;r:8}100%{opacity:0;r:22}}
  .shine{animation:shn 3.6s ease-in-out infinite}
  @keyframes shn{0%{transform:translateX(-100px)}55%,100%{transform:translateX(340px)}}
  .cta{animation:pk 2.2s ease-in-out infinite}
  @keyframes pk{0%,100%{opacity:.7}50%{opacity:1}}
</style>
<defs>
  <linearGradient id="chipG2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0a1224"/><stop offset="1" stop-color="#101c3a"/>
  </linearGradient>
  <linearGradient id="shineG2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="chipClip2"><rect width="300" height="66" rx="14"/></clipPath>
</defs>
<rect width="300" height="66" rx="14" fill="url(#chipG2)" stroke="#a78bfa" stroke-opacity="0.85" stroke-width="1.5"/>
<g clip-path="url(#chipClip2)"><rect class="shine" x="0" y="0" width="80" height="66" fill="url(#shineG2)"/></g>

<circle cx="36" cy="33" r="8" fill="none" stroke="#a78bfa" class="ring"/>
<rect x="20" y="17" width="32" height="32" rx="8" fill="#0d1117" stroke="#2d333b"/>
<circle cx="36" cy="32" r="9" fill="none" stroke="#e6edf3" stroke-width="1.8"/>
<path d="M27.5 36 q4 3.5 8.5 3.5 q4.5 0 8.5 -3.5" stroke="#e6edf3" stroke-width="1.6" fill="none"/>
<circle cx="32.5" cy="30" r="1.2" fill="#e6edf3"/><circle cx="39.5" cy="30" r="1.2" fill="#e6edf3"/>
<text x="64" y="27" font-size="11" letter-spacing="2.5" fill="#7c8db0">GITHUB</text>
<text x="64" y="49" font-size="14.5" fill="#e6f1ff">@avani376</text>
<text class="cta" x="284" y="41" text-anchor="end" font-size="12" letter-spacing="2" fill="#a78bfa">OPEN ▸</text>
</svg>
