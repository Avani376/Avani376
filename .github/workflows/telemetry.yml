name: render telemetry
on:
  schedule:
    - cron: "37 2 * * *" # daily — keeps stats.svg + snake.svg fresh
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # stdlib-only renderer: no pip, no third-party actions, no external services
      - name: render stats + snake from GitHub API
        run: python3 tools/render_telemetry.py
        env:
          GH_TOKEN: ${{ github.token }}

      # commit only on success → the profile always shows the last-good render
      - name: commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/snake.svg
          if git diff --cached --quiet; then
            echo "no changes since last render"
          else
            git commit -m "telemetry: auto-render [skip ci]"
            git push
          fi
